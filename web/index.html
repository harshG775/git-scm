<!doctype html>
<html lang="en" class="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta name="theme-color" content="#0d1113" />
        <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <title>git scm</title>
        <script>
            /* apply the saved theme before first paint (same rule as src/lib/theme.ts) */
            (function () {
                var theme = "auto";
                try {
                    var key = "git-scm.settings";
                    var legacyKey = "git-csm.settings";
                    if (localStorage.getItem(key) === null && localStorage.getItem(legacyKey) !== null) {
                        localStorage.setItem(key, localStorage.getItem(legacyKey));
                        localStorage.removeItem(legacyKey);
                    }
                    theme = JSON.parse(localStorage.getItem(key)).state.theme || "auto";
                } catch (e) {}
                var dark = theme === "dark" || (theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
                document.documentElement.classList.toggle("dark", dark);
                document.documentElement.style.colorScheme = dark ? "dark" : "light";
                document.querySelector('meta[name="theme-color"]').content = dark ? "#0d1113" : "#edf1ef";
            })();
        </script>
        <style>
            /* painted before any JS: dark background plus a workspace-shaped skeleton, removed once React mounts */
            html,
            body {
                margin: 0;
            }
            /* Skeleton colors follow the theme class set by the script above. Only #boot is styled here:
               an unlayered rule on html/body would beat Tailwind's base layer and pin the page background. */
            #boot {
                --boot-bg: #edf1ef;
                --boot-pane: #ffffff;
                --boot-bar: #dae2de;
                --boot-hint: #5c6870;
            }
            .dark #boot {
                --boot-bg: #0d1113;
                --boot-pane: #151b1e;
                --boot-bar: #1b2327;
                --boot-hint: #8a989e;
            }
            #boot {
                position: fixed;
                inset: 0;
                z-index: 1;
                display: flex;
                background: var(--boot-bg);
                font-family: system-ui, sans-serif;
            }
            #boot .pane {
                display: flex;
                flex-direction: column;
                gap: 14px;
                padding: 14px 12px;
                box-sizing: border-box;
                width: 100%;
                max-width: 32rem;
                background: var(--boot-pane);
            }
            #boot .main {
                display: none;
                flex: 1;
                flex-direction: column;
                gap: 14px;
                padding: 14px 16px;
            }
            #boot .bar {
                height: 14px;
                border-radius: 6px;
                background: var(--boot-bar);
                animation: boot-pulse 1.6s ease-in-out infinite;
            }
            #boot .hint {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 24px;
                text-align: center;
                font-size: 13px;
                color: var(--boot-hint);
                opacity: 0;
                animation: boot-hint 0.3s 12s forwards;
            }
            @keyframes boot-pulse {
                50% {
                    opacity: 0.5;
                }
            }
            @keyframes boot-hint {
                to {
                    opacity: 1;
                }
            }
            @media (min-width: 768px) {
                #boot .pane {
                    width: 320px;
                }
                #boot .main {
                    display: flex;
                }
            }
        </style>
    </head>
    <body>
        <div id="app"></div>
        <div id="boot" aria-hidden="true">
            <div class="pane">
                <div class="bar" style="width: 45%; height: 18px"></div>
                <div class="bar" style="width: 100%; height: 34px"></div>
                <div class="bar" style="width: 60%"></div>
                <div class="bar" style="width: 40%"></div>
                <div class="bar" style="width: 70%"></div>
                <div class="bar" style="width: 50%"></div>
                <div class="bar" style="width: 65%"></div>
            </div>
            <div class="main">
                <div class="bar" style="width: 55%; height: 18px"></div>
                <div class="bar" style="width: 85%"></div>
                <div class="bar" style="width: 70%"></div>
                <div class="bar" style="width: 90%"></div>
                <div class="bar" style="width: 60%"></div>
            </div>
            <p class="hint">Taking longer than usual… try reloading the page.</p>
        </div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
