<!doctype html>
<html lang="en" class="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta name="theme-color" content="#262626" />
        <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <title>git csm</title>
        <style>
            /* painted before any JS: dark background plus a workspace-shaped skeleton, removed once React mounts */
            html,
            body {
                margin: 0;
                background: #0a0a0a;
            }
            #boot {
                position: fixed;
                inset: 0;
                z-index: 1;
                display: flex;
                background: #0a0a0a;
                font-family: system-ui, sans-serif;
            }
            #boot .pane {
                display: flex;
                flex-direction: column;
                gap: 14px;
                padding: 14px 12px;
                box-sizing: border-box;
                width: 100%;
                max-width: 32rem;
                background: #171717;
            }
            #boot .main {
                display: none;
                flex: 1;
                flex-direction: column;
                gap: 14px;
                padding: 14px 16px;
            }
            #boot .bar {
                height: 14px;
                border-radius: 6px;
                background: #262626;
                animation: boot-pulse 1.6s ease-in-out infinite;
            }
            #boot .hint {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 24px;
                text-align: center;
                font-size: 13px;
                color: #a3a3a3;
                opacity: 0;
                animation: boot-hint 0.3s 12s forwards;
            }
            @keyframes boot-pulse {
                50% {
                    opacity: 0.5;
                }
            }
            @keyframes boot-hint {
                to {
                    opacity: 1;
                }
            }
            @media (min-width: 768px) {
                #boot .pane {
                    width: 320px;
                }
                #boot .main {
                    display: flex;
                }
            }
        </style>
    </head>
    <body>
        <div id="app"></div>
        <div id="boot" aria-hidden="true">
            <div class="pane">
                <div class="bar" style="width: 45%; height: 18px"></div>
                <div class="bar" style="width: 100%; height: 34px"></div>
                <div class="bar" style="width: 60%"></div>
                <div class="bar" style="width: 40%"></div>
                <div class="bar" style="width: 70%"></div>
                <div class="bar" style="width: 50%"></div>
                <div class="bar" style="width: 65%"></div>
            </div>
            <div class="main">
                <div class="bar" style="width: 55%; height: 18px"></div>
                <div class="bar" style="width: 85%"></div>
                <div class="bar" style="width: 70%"></div>
                <div class="bar" style="width: 90%"></div>
                <div class="bar" style="width: 60%"></div>
            </div>
            <p class="hint">Taking longer than usual… try reloading the page.</p>
        </div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
