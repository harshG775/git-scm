name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web app
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vp build

      - name: Embed web app
        run: |
          rm -rf server/internal/ui/dist
          mkdir -p server/internal/ui/dist
          cp -r web/dist/. server/internal/ui/dist/

      - name: Cross-compile
        working-directory: server
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          for arch in arm64 amd64; do
            GOARCH=$arch go build -trimpath -ldflags="-s -w" -o ../dist/git-csm-linux-$arch .
          done

      - name: Checksums
        working-directory: dist
        run: sha256sum git-csm-linux-* > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/git-csm-linux-*
            dist/checksums.txt
