<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pocket Git</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone-width column. Top bar (repo + branch), scrolling view, bottom tabs.
   Sheets rise from the bottom for actions; pages slide in for diffs, conflicts and PRs. */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --surface2:#F4F7F5; --ink:#13181B; --muted:#5C6870; --line:#DAE2DE;
  --accent:#D84A1B; --accent-ink:#FFFFFF; --accent-soft:#FBE6DD;
  --add:#17803F; --add-bg:#E2F3E8; --del:#C4332D; --del-bg:#FAE5E3; --mod:#9A6407; --mod-bg:#FAEFD6;
  --info:#2B63D0; --info-bg:#E3ECFB;
  --shadow:0 -12px 40px rgba(10,22,28,.22);
  --ui:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1113; --surface:#151B1E; --surface2:#1B2327; --ink:#E7EDEB; --muted:#8A989E; --line:#263136;
    --accent:#FF7A4D; --accent-ink:#1B0C05; --accent-soft:#3B2016;
    --add:#4CC27F; --add-bg:#12301F; --del:#FF7068; --del-bg:#3B1B1A; --mod:#E6B54D; --mod-bg:#33290F;
    --info:#74A3FF; --info-bg:#172641; --shadow:0 -12px 40px rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1113; --surface:#151B1E; --surface2:#1B2327; --ink:#E7EDEB; --muted:#8A989E; --line:#263136;
  --accent:#FF7A4D; --accent-ink:#1B0C05; --accent-soft:#3B2016;
  --add:#4CC27F; --add-bg:#12301F; --del:#FF7068; --del-bg:#3B1B1A; --mod:#E6B54D; --mod-bg:#33290F;
  --info:#74A3FF; --info-bg:#172641; --shadow:0 -12px 40px rgba(0,0,0,.65);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--ui);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.ic{flex:none}
#app{position:relative;height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (min-width:520px){body{background:var(--surface2)}#app{border-inline:1px solid var(--line)}}

/* top bar */
#top{display:flex;align-items:center;gap:6px;padding:12px 10px 8px 16px}
.repo{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.rname{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:500}
.bchip{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;max-width:100%;height:36px;padding:0 10px 0 11px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font:600 14px var(--mono)}
.bchip span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bchip.det{border-color:var(--mod);color:var(--mod)}
.iconbtn{position:relative;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.iconbtn:active{background:var(--surface2)}
.iconbtn .dot{position:absolute;top:4px;right:2px;min-width:17px;height:17px;border-radius:9px;padding:0 4px;background:var(--accent);color:var(--accent-ink);font:600 10px/17px var(--ui);text-align:center}
.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;font-size:11px;font-weight:500;color:var(--muted);border-radius:10px;min-width:0}
.tab[aria-selected="true"]{color:var(--accent)}
.tab .badge{position:absolute;top:2px;left:calc(50% + 7px);min-width:17px;height:17px;border-radius:9px;padding:0 5px;background:var(--accent);color:var(--accent-ink);font:600 10px/17px var(--ui);text-align:center}
.tab .badge.quiet{background:var(--surface2);color:var(--muted);border:1px solid var(--line);line-height:15px}

/* view */
#view{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:2px 14px 24px;overscroll-behavior:contain}
.sect{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 2px 8px;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.sect .n{display:inline-flex;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--surface);border:1px solid var(--line);align-items:center;justify-content:center;margin-left:6px;letter-spacing:0;font-size:11px}
.sect .acts{display:flex;gap:14px;align-items:center}
.link{color:var(--accent);font-weight:600;font-size:13px;letter-spacing:0;text-transform:none}
.link.quiet{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 16px;border-radius:12px;font-weight:600;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--del)}
.btn.primary.danger{background:var(--del);color:#fff}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.pill{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:10px;font-size:11px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--add-bg);color:var(--add)}.pill.bad{background:var(--del-bg);color:var(--del)}
.pill.warn{background:var(--mod-bg);color:var(--mod)}.pill.info{background:var(--info-bg);color:var(--info)}

/* sync card */
.sync{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px;margin-top:6px}
.sync-l{flex:1;min-width:0}
.sync-l .t{font:600 13px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync-l .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.sync .btn{padding:0 12px}
.sync .btn.hot{background:var(--accent-soft);border-color:transparent;color:var(--accent)}

/* file rows */
.flist>*+*{border-top:1px solid var(--line)}
.vrow{display:flex;justify-content:flex-end;margin-top:12px}
.vseg{display:inline-grid;grid-auto-columns:minmax(84px,auto)}
.vseg.fill{display:grid;flex:1;grid-auto-columns:1fr}
.vseg button{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px}
.drow{display:flex;align-items:center;gap:8px;min-height:48px;padding-right:12px;background:var(--surface)}
.dmain{flex:1;min-width:0;display:flex;align-items:center;gap:8px;min-height:44px;font-weight:600;font-size:14px}
.dmain .tn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dmain .chev{flex:none;width:16px;display:grid;place-items:center;color:var(--muted);transition:transform .15s}
.dmain .chev.open{transform:rotate(90deg)}
.file{position:relative;overflow:hidden}
.swipe-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:600;font-size:13px;color:#fff;opacity:0}
.swipe-bg span{display:none}
.file[data-dir="r"] .swipe-bg{opacity:1;background:var(--add)}
.file[data-dir="r"] .swipe-bg .sl{display:block}
.file[data-dir="l"] .swipe-bg{opacity:1;background:var(--del)}
.file[data-dir="l"][data-kind="staged"] .swipe-bg{background:var(--mod)}
.file[data-dir="l"] .swipe-bg .sr{display:block;margin-left:auto}
.fg{position:relative;background:var(--surface);display:flex;align-items:center;gap:11px;padding:11px 12px 11px 14px;touch-action:pan-y;transition:transform .18s;cursor:pointer;user-select:none;-webkit-user-select:none}
.st{flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font:600 12px var(--mono)}
.st-M{color:var(--mod);background:var(--mod-bg)}.st-A{color:var(--add);background:var(--add-bg)}
.st-D{color:var(--del);background:var(--del-bg)}.st-u{color:var(--info);background:var(--info-bg)}.st-C{color:#fff;background:var(--del)}
.fmeta{flex:1;min-width:0}
.fname{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fdir{font:12px var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.fstat{display:flex;flex-direction:column;align-items:flex-end;font:12px/1.25 var(--mono)}
.fstat .a{color:var(--add)}.fstat .d{color:var(--del)}
.circ{flex:none;width:30px;height:30px;border-radius:50%;border:1.8px solid var(--line);display:grid;place-items:center;color:var(--accent-ink);margin-left:2px}
.circ.on{background:var(--accent);border-color:var(--accent)}
.circ:not(.on):hover{border-color:var(--accent)}

/* composer */
.composer{border-top:1px solid var(--line);background:var(--surface);padding:10px 14px 10px;display:flex;flex-direction:column;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:28px;padding:0 11px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);font:500 12px var(--mono)}
.crow2{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;min-height:42px;max-height:96px;line-height:1.35;font-size:14.5px}
.composer .btn{height:42px}
.composer.inl{border:1px solid var(--line);border-radius:16px;margin:4px 0 6px}
.cfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.cfoot label{display:flex;align-items:center;gap:6px;white-space:nowrap}
.cfoot .link{white-space:nowrap}
.hint{font-size:12.5px;color:var(--muted);margin-top:-2px}
.hint:empty{display:none}
.rc .rn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;margin:0}

/* merge banner */
.banner{border:1px solid var(--del);background:var(--del-bg);border-radius:16px;padding:12px 12px 12px;margin-top:6px}
.banner .bh{display:flex;gap:8px;align-items:center;color:var(--del)}
.banner p{margin:6px 0 10px;font-size:13.5px}
.cfile{display:flex;align-items:center;gap:10px;width:100%;padding:10px;margin-bottom:6px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:13px}
.cfile .mono{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cfile.ok .st{background:var(--add);color:#fff}

/* graph */
.gctl{display:flex;flex-direction:column;gap:8px;padding:2px 14px 8px}
.search{display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:14.5px}
.gbar{display:flex;align-items:center;gap:6px}
.gbar .search{flex:1;min-width:0;height:38px}
.gbar .iconbtn.bord{width:38px;height:38px}
.refchip{display:inline-flex;align-items:center;gap:7px;height:38px;max-width:42%;flex:none;padding:0 10px 0 11px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:650;font-size:14px}
.refchip svg{flex:none}.refchip span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cbody{position:relative}.cbody.hasf{padding-right:56px}
.cfb{position:absolute;right:8px;top:50%;transform:translateY(-50%);height:32px;min-width:40px;padding:0 8px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:4px;color:var(--muted);font:600 11px var(--mono)}
.cfb i{font-style:normal}.cfb:active{background:var(--surface2)}.cfb.on{background:var(--accent-soft);color:var(--accent)}
.cfiles{display:flex}.cgut{flex:none}
.cfl{flex:1;min-width:0;margin:0 10px 8px 0;padding:3px 0;border-radius:10px;background:var(--surface2)}
.cfr{display:flex;align-items:center;gap:8px;width:100%;height:38px;padding:0 12px 0 10px;text-align:left}
.cfr:active{background:var(--line)}
.cfr .tn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.cfr .tn small{margin-left:7px;font:11.5px var(--mono);color:var(--muted)}
.cfr .cs{flex:none;font:600 12px var(--mono)}.cs.sM{color:var(--mod)}.cs.sA{color:var(--add)}.cs.sD{color:var(--del)}
.crow.flash .cbody{animation:flash 1.4s ease-out}
@keyframes flash{0%,55%{background:var(--accent-soft)}100%{background:transparent}}
.pickbar{display:flex;gap:8px;align-items:center}.pickbar .search{flex:1;min-width:0}
.selc{flex:none;font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:9px;white-space:nowrap}
.rrow{display:flex;align-items:center;gap:11px;width:100%;padding:10px 2px;text-align:left}
.rrow+.rrow{border-top:1px solid var(--line)}
.cbx{flex:none;width:22px;height:22px;border-radius:7px;border:1.6px solid var(--muted);display:grid;place-items:center;color:var(--accent-ink)}
.cbx.on{background:var(--accent);border-color:var(--accent)}
.ri{flex:none;display:grid;color:var(--muted)}
.rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rt b{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:3px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.seg button{height:32px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);text-align:center}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.crow{display:flex;height:68px;cursor:pointer}
.crow svg{flex:none}
.crow path{fill:none;stroke-width:2.2;stroke-linecap:round}
.crow circle{stroke:var(--surface);stroke-width:2}
.crow circle.merge{fill:var(--surface);stroke-width:2.6}
.crow circle.headring{fill:none;stroke:var(--accent);stroke-width:1.6}
.cbody{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:0 14px 0 2px;border-bottom:1px solid var(--line)}
.crow:last-child .cbody{border-bottom:0}
.flat .cbody{padding-left:14px}
.cmsg{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmeta{display:flex;gap:8px;font-size:12px;color:var(--muted);min-width:0}
.cmeta .mono{color:var(--ink);opacity:.7}
.cmeta span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.refs{display:flex;gap:5px;flex-wrap:wrap;overflow:hidden;max-height:22px}
.rc{display:inline-flex;align-items:center;gap:3px;max-width:150px;height:20px;padding:0 7px;border-radius:7px;font:500 11px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc.local{background:var(--accent-soft);color:var(--accent)}
.rc.local.cur{background:var(--accent);color:var(--accent-ink)}
.rc.remote{background:var(--info-bg);color:var(--info)}
.rc.tag{background:var(--mod-bg);color:var(--mod)}
.rc.more{background:var(--surface2);color:var(--muted)}

/* branches */
.brow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px}
.brow+.brow{border-top:1px solid var(--line)}
.bdot{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);color:var(--muted)}
.bdot.cur{background:var(--accent);color:var(--accent-ink)}
.bmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.bname{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bsub{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bsub.up{font:11.5px var(--mono)}
.bbadges{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ab{display:inline-flex;align-items:center;gap:2px;font:600 12px var(--mono)}
.ab.up{color:var(--add)}.ab.dn{color:var(--mod)}
.toprow{display:flex;gap:8px;align-items:center;margin:4px 0 10px}
.toprow .search{flex:1;min-width:0}
.search input{width:100%}

/* stash */
.stcard{padding:14px;margin-bottom:10px}
.stcard .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.stcard .m{font-weight:600;font-size:14.5px}
.stcard .s{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.stcard .b{display:flex;gap:8px;margin-top:12px}
.stcard .b .btn{flex:1}

/* PRs */
.pr{display:block;width:100%;padding:13px 14px}
.pr+.pr{border-top:1px solid var(--line)}
.pr .t{font-weight:600;font-size:14.5px;margin-bottom:4px}
.pr .b{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.pr .b .mono{font-size:11.5px;color:var(--ink);opacity:.75}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px}
.chk+.chk{border-top:1px solid var(--line)}
.ci{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;margin-top:1px}
.ci.pass{background:var(--add-bg);color:var(--add)}.ci.fail{background:var(--del-bg);color:var(--del)}.ci.pend{background:var(--mod-bg);color:var(--mod)}
.ci.pend i{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}
.cmt{padding:12px 14px;display:flex;gap:10px}
.cmt+.cmt{border-top:1px solid var(--line)}
.cmt p{margin:2px 0 0;font-size:14px}
.cmt small{color:var(--muted)}
.av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--ui);color:#fff}
.say{display:flex;gap:8px;margin-top:10px}
.say input{flex:1;min-width:0;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:14.5px}

/* pages, sheets, toast */
#pages{position:absolute;inset:0;pointer-events:none;z-index:20}
.page{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;pointer-events:auto}
.page.enter{animation:slidein .24s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{transform:translateX(30%);opacity:0}}
.phead{display:flex;align-items:center;gap:4px;padding:10px 10px 8px 6px;border-bottom:1px solid var(--line);background:var(--surface)}
.ptitle{flex:1;min-width:0;font-weight:650;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptitle small{display:block;font:500 11.5px var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.pfoot{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
.pfoot .btn{flex:1}
#scrim{position:absolute;inset:0;background:rgba(4,10,12,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#scrim.on{opacity:1;pointer-events:auto}

.li{display:flex;align-items:center;gap:13px;width:100%;padding:12px 4px;border-top:1px solid var(--line)}

.li svg:first-child{color:var(--muted)}
.li span{flex:1;min-width:0;display:flex;flex-direction:column}
.li b{font-weight:600;font-size:15px}
.li small{font-size:12.5px;color:var(--muted)}
.li.danger b,.li.danger svg:first-child{color:var(--del)}
.li.off{opacity:.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 .btn{justify-content:flex-start;height:44px}
.field{display:flex;flex-direction:column;gap:6px;margin:8px 0 12px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input[type=text],.field input:not([type]),.field select{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:15px}
.field input.mono{font-family:var(--mono);font-size:14px}
.row-chk{display:flex;align-items:center;gap:10px;margin:2px 0 14px;font-size:14px}
.meta{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.meta div{flex:1;min-width:0;display:flex;flex-direction:column}

.parents{font-size:13px;color:var(--muted);margin-bottom:8px}
.parents .link{font:600 12.5px var(--mono)}

.toast{max-width:100%;padding:10px 14px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:13.5px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .2s ease-out}
.toast.err{background:var(--del);color:#fff}
@keyframes tin{from{transform:translateY(8px);opacity:0}}

/* diff */
.fhead{display:flex;align-items:center;gap:10px;padding:12px 2px 2px}
.fhead .mono{font-size:12.5px;word-break:break-all}
.hunk{margin:12px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}

.hunk.staged{border-color:var(--accent)}
.diff{overflow-x:auto;font:12.5px/1.65 var(--mono)}
.dl{display:flex;width:max-content;min-width:100%}

function startMerge(from,theirTip){
  const theirs=byH(theirTip),extra=[...anc(theirTip)].filter(h=>!anc(headTip()).has(h)).flatMap(h=>byH(h)?.f||[]);
  const clean=[...new Set(extra)].filter(p=>p!==CONFLICT.path);
  S.merge={from,theirTip,files:[{path:CONFLICT.path,done:false,hunks:CONFLICT.hunks.map(h=>({...h,pick:null}))}]};
  clean.forEach(p=>wtAdd(p,'A',true));
  S.msg=`Merge branch '${from}' into ${S.head}`;S.tab='changes';
  render();toast('Merge stopped: 1 file has conflicts','err');
}
function mergeInto(from,tip){
  if(S.merge){toast('Finish or abort the current merge first','err');return}
  if(!S.head){toast('Switch to a branch before merging','err');return}
  const cur=headTip();
  if(anc(cur).has(tip)){toast('Already up to date');return}
  if(anc(tip).has(cur)){setTip(tip);logR(`merge ${from}: Fast-forward`);render();toast(`Fast-forwarded ${S.head}`);return}
  if(from==='feature/login-flow'||from==='origin/feature/login-flow'){startMerge(from,tip);return}
  const nh=newHash(),files=[...new Set([...anc(tip)].filter(h=>!anc(cur).has(h)).flatMap(h=>byH(h)?.f||[]))];
  S.commits.unshift({h:nh,p:[cur,tip],m:`Merge branch '${from}' into ${S.head}`,a:ME,t:0,f:files});setTip(nh);
  logR(`merge ${from}: Merge made by the ort strategy`);render();toast(`Merged ${from} into ${S.head}`);
}

const RE_TS=/(\/\/.*$|\/\*.*?\*\/)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`(?:[^`\\]|\\.)*`)|\b(import|from|export|const|let|var|function|return|if|else|async|await|type|interface|class|new|default|for|of|in|throw|try|catch|extends|describe|it|expect)\b|\b(\d[\d_.]*)\b/g;

function hl(line,ext){

  if(!re)return/^\s*#/.test(line)?`<span class="tk-c">${esc(line)}</span>`:esc(line);

      const seg=`<div class="seg" style="margin:12px 0 4px">${tabs.map(([k,l])=>`<button data-act="fvTab" data-v="${k}" aria-pressed="${st.tab===k}">${l}</button>`).join('')}</div>`;
      if(st.tab==='history'){
        const vis=visible(),refs=refsMap(),hs=S.commits.filter(c=>vis.has(c.h)&&(c.f||[]).includes(path));
        return meta+seg+(hs.length?`<div class="card" style="margin-top:12px">${hs.map(c=>crow(c,null,refs)).join('')}</div>`:`<div class="card" style="margin-top:12px"><div class="empty"><b>No history yet</b>${e&&e.st==='?'?'This file is not tracked. Commit it to start its history.':'No commit touches this file.'}</div></div>`);
      }
      if(st.tab==='changes')return meta+seg+diffHtml(path);
      if(!t)return meta+seg+'<div class="card" style="margin-top:12px"><div class="empty">This file is empty.</div></div>';
      return meta+seg+`<section class="hunk" style="margin-top:12px"><div class="diff">${lines.map((l,i)=>`<div class="dl one"><i>${i+1}</i><code>${hl(l,ext)||' '}</code></div>`).join('')}</div></section>`;
    }
  };
}

    openSheet(()=>sh('Branches have diverged',`<p class="body">${esc(S.head)} has ${s.a} local commit${s.a>1?'s':''} and ${esc(b.up)} has ${s.b} new one${s.b>1?'s':''}. Choose how to combine them.</p>

  },
  revert(el){
    const c=byH(el.dataset.h);if(c.p.length>1){toast('Reverting a merge needs a parent. Not supported here.','err');return}
    closeSheet();const nh=newHash();S.commits.unshift({h:nh,p:[headTip()],m:`Revert "${subject(c.m)}"\n\nThis reverts commit ${c.h}.`,a:ME,t:0,f:c.f});setTip(nh);logR('revert: '+subject(c.m));render();toast('Reverted as '+nh);
  },
  resetSheet(el){resetSheet(el.dataset.h)},
  doReset(el){
    const h=el.dataset.h,mode=el.dataset.mode,run=()=>{
      const cur=headTip(),keep=anc(h),dropped=[...anc(cur)].filter(x=>!keep.has(x));
      setTip(h);
      if(mode==='hard')S.wt=[];else dropped.flatMap(x=>byH(x)?.f||[]).forEach(p=>wtAdd(p,'M',mode==='soft'));
      logR(`reset: moving to ${h} (${mode})`);closeSheet();render();toast(`Reset ${mode} to ${h}`);
    };
    if(mode==='hard'){confirmSheet({force:true,title:'Hard reset?',text:'All uncommitted changes are discarded and the branch moves to <b class="mono">'+h+'</b>. Commits you leave behind stay in the reflog.',label:'Hard reset',run})}
    else run();
  },
  /* merge resolution */
  openResolver(el){openPage(resolverPage(el.dataset.path))},
  pick(el){
    const f=S.merge.files.find(x=>x.path===el.dataset.path),h=f.hunks[el.dataset.i];h.pick=h.pick===el.dataset.v?null:el.dataset.v;render();
  },
  markResolved(el){
    const f=S.merge.files.find(x=>x.path===el.dataset.path);f.done=true;wtAdd(f.path,'M',true);pages.pop();render();
    toast(S.merge.files.every(x=>x.done)?'All conflicts resolved':'File marked as resolved');
  },
  abortMerge(){
    confirmSheet({title:'Abort merge?',text:'Your branch returns to how it was before the merge. Conflict resolutions are lost.',label:'Abort merge',run:()=>{
      const staged=new Set(S.merge.files.map(f=>f.path));const theirs=[...anc(S.merge.theirTip)].filter(h=>!anc(headTip()).has(h)).flatMap(h=>byH(h)?.f||[]);
      S.wt=S.wt.filter(e=>!(theirs.includes(e.path)&&e.st==='A'));S.merge=null;S.msg='';render();toast('Merge aborted');
    }});
  },
  /* stash */
  stashSheet(){
    if(!S.wt.length){toast('Nothing to stash','err');return}
    openSheet(()=>sh('Stash changes',`<div class="field"><label for="sm">Message (optional)</label><input id="sm" type="text" placeholder="WIP on ${esc(S.head||'HEAD')}"></div><label class="row-chk"><input type="checkbox" id="si" checked>Include untracked files</label><button class="btn primary block" data-act="doStash">Stash ${S.wt.length} file${S.wt.length>1?'s':''}</button>`));
    setTimeout(()=>{const i=$('#sm');i&&i.focus()},300);
  },
  doStash(){
    const incl=$('#si').checked,items=S.wt.filter(e=>incl||e.st!=='?');if(!items.length){toast('Nothing to stash','err');return}
    const m=($('#sm').value||'').trim()||`WIP on ${S.head||'HEAD'}: ${subject(byH(headTip()).m)}`;
    S.stashes.unshift({msg:m,br:S.head||'detached',t:0,files:items.map(e=>({path:e.path,st:e.st}))});S.wt=S.wt.filter(e=>!items.includes(e));
    closeSheet();render();toast('Stashed '+items.length+' file'+(items.length>1?'s':''));
  },
  stashApply(el){const i=+el.dataset.i,s=S.stashes[i];s.files.forEach(f=>wtAdd(f.path,f.st,false));render();toast(`Applied stash@{${i}}`)},
  stashPop(el){const i=+el.dataset.i,s=S.stashes[i];s.files.forEach(f=>wtAdd(f.path,f.st,false));S.stashes.splice(i,1);render();toast('Popped stash. Changes are back in your tree.')},
  stashDrop(el){const i=+el.dataset.i;confirmSheet({title:`Drop stash@{${i}}?`,text:esc(S.stashes[i].msg)+'<br>The stash is deleted and cannot be recovered from the app.',label:'Drop stash',run:()=>{S.stashes.splice(i,1);render();toast('Stash dropped')}})},
  stashOpen(el){
    const i=+el.dataset.i;
    openPage({title:()=>`stash@{${i}}<small>${esc((S.stashes[i]||{}).msg||'')}</small>`,
      body:()=>{const s=S.stashes[i];if(!s)return'<div class="empty"><b>Stash is gone</b></div>';return`${sect('Files',s.files.length)}<div class="card flist">${s.files.map(f=>{const x=stats(f.path,allIdx(f.path));return`<div class="file"><div class="fg" data-act="stashFile" data-path="${esc(f.path)}"><span class="st st-${f.st==='?'?'u':f.st}">${f.st==='?'?'U':f.st}</span><div class="fmeta"><div class="fname">${esc(basename(f.path))}</div><div class="fdir">${esc(dirname(f.path)||'/')}</div></div><div class="fstat"><span class="a">+${x.a}</span><span class="d">−${x.d}</span></div>${ic('chevR',16)}</div></div>`}).join('')}</div>`},
      foot:()=>S.stashes[i]?`<button class="btn" data-act="stashApplyBack" data-i="${i}">Apply</button><button class="btn primary" data-act="stashPopBack" data-i="${i}">Pop</button>`:''});
  },
  stashFile(el){openPage(filePage(el.dataset.path,'stash'))},
  stashApplyBack(el){acts.stashApply(el);pages.pop();renderPages()},
  stashPopBack(el){acts.stashPop(el);pages.pop();renderPages()},
  /* PRs */
  prOpen(el){openPage(prPage(+el.dataset.n))},
  prFile(el){openPage(filePage(el.dataset.path,'pr'))},
  prComment(el){const i=$('#prc'),v=(i.value||'').trim();if(!v)return;S.prs.find(p=>p.n==el.dataset.n).comments.push({by:ME,t:'now',x:v});renderPages();toast('Comment posted')},
  prApprove(el){const p=S.prs.find(x=>x.n==el.dataset.n),r=p.reviews.find(x=>x[0]===ME);if(r)r[1]='approved';else p.reviews.push([ME,'approved']);renderPages();toast('Approved #'+p.n)},
  prMergeSheet(el){
    const n=el.dataset.n,p=S.prs.find(x=>x.n==n);
    openSheet(()=>sh(`Merge #${n}`,`<p class="body">${esc(p.title)}</p><div class="field"><label for="pm">Method</label><select id="pm"><option>Create a merge commit</option><option>Squash and merge</option><option>Rebase and merge</option></select></div><button class="btn primary block" data-act="prMerge" data-n="${n}">${ic('merge',17)}Confirm merge</button>`));
  },
  prMerge(el){const p=S.prs.find(x=>x.n==el.dataset.n);p.state='merged';closeSheet();render();toast(`Merged #${p.n} into ${p.to}`)},
  newPr(){
    const from=S.head||'';
    openSheet(()=>sh('New pull request',`<div class="field"><label for="pt">Title</label><input id="pt" type="text" value="${esc(from?subject(byH(S.branches[from].tip).m):'')}"></div><div class="parents"><span class="mono">${esc(from||'(detached)')}</span> → <span class="mono">main</span></div><button class="btn primary block" data-act="doNewPr" ${from&&from!=='main'?'':'disabled'}>${from==='main'?'Switch off main first':'Open pull request'}</button>`));
  },
  doNewPr(){
    const t=($('#pt').value||'').trim();if(!t){toast('Add a title','err');return}
    const n=Math.max(...S.prs.map(p=>p.n))+1;S.prs.unshift({n,title:t,from:S.head,to:'main',by:ME,state:'open',draft:false,age:'now',body:'Opened from Pocket Git.',checks:[['build','pend','Queued']],reviews:[],files:byH(headTip()).f||[],comments:[]});
    S.prf='open';closeSheet();render();toast('Opened #'+n);
  },
  /* menu, reflog, settings */
  menu(){
    openSheet(()=>sh('Repository',li('clock','Reflog','reflogPage','','Every place HEAD has been. Undo almost anything.')+li('gear','Settings','settingsPage','','Identity, accounts, appearance, safety')+li('cloud','Remotes','remotesSheet','','origin · github.com/acme/pocket-notes')));
  },
  remotesSheet(){openSheet(()=>sh('Remotes',`<div class="card"><div class="rl"><span class="t"><b class="mono" style="font-size:13px">origin</b><br><span class="muted mono" style="font-size:12px">git@github.com:acme/pocket-notes.git</span></span><span class="pill ok">SSH</span></div></div><p class="body" style="margin-top:12px">Fetch and push use your device SSH key <span class="mono">id_ed25519</span>.</p>`))},
  reflogPage(){
    closeSheet();
    openPage({title:()=>'Reflog<small>Tap an entry to go back to it</small>',body:()=>`<div class="card" style="margin-top:12px">${S.reflog.map((r,i)=>`<button class="rl" data-act="reflogOpen" data-i="${i}"><span class="ix">HEAD@{${i}}</span><span class="t">${esc(r.text)}</span><span class="mono h">${r.h}</span></button>`).join('')}</div>`});
  },
  reflogOpen(el){
    const r=S.reflog[+el.dataset.i];
    openSheet(()=>sh(esc(r.text),`<p class="body"><span class="mono">${r.h}</span> on ${esc(r.br)} · ${age(r.m)} ago</p>${li('rewind','Reset current branch here','resetSheet',`data-h="${r.h}"`,'Soft, mixed or hard')+li('branch','Create branch here','newBranch',`data-from="${r.h}"`,'Rescue work without moving anything')+li('commit','View commit','commitOpen',`data-h="${r.h}"`)}`));
  },
  settingsPage(){
    closeSheet();
    const tog=(k,t,s)=>`<div class="set"><span><b>${t}</b><small>${s}</small></span><button class="sw" role="switch" aria-checked="${S.set[k]}" aria-label="${t}" data-act="toggleSet" data-k="${k}"></button></div>`;
    openPage({title:()=>'Settings',body:()=>`${sect('Identity','')}<div class="card"><div class="set"><span><b>${esc(S.set.name)}</b><small>${esc(S.set.email)}</small></span>${ic('user',20)}</div></div>
      ${sect('Appearance','')}<div class="seg"><button data-act="setTheme" data-v="auto" aria-pressed="${S.theme==='auto'}">Auto</button><button data-act="setTheme" data-v="light" aria-pressed="${S.theme==='light'}">Light</button><button data-act="setTheme" data-v="dark" aria-pressed="${S.theme==='dark'}">Dark</button></div>
      ${sect('Safety','')}<div class="card">${tog('confirm','Confirm destructive actions','Ask before discarding, dropping or deleting')}${tog('bio','Biometric lock','Require Face ID or fingerprint to open')}${tog('auto','Auto-fetch','Check the remote every 5 minutes')}</div>`});
  },
  toggleSet(el){S.set[el.dataset.k]=!S.set[el.dataset.k];renderPages()},
  setTheme(el){S.theme=el.dataset.v;const r=document.documentElement;if(S.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme);try{localStorage.setItem('pg-theme',S.theme)}catch(e){}renderPages()}
};

/* ============ events ============ */
let suppress=false;
function act(name,el){const f=acts[name];if(f)f(el)}
$('#app').addEventListener('click',e=>{
  if(suppress)return;const el=e.target.closest('[data-act]');if(!el)return;
  if(el.type==='checkbox'){acts[el.dataset.act]&&acts[el.dataset.act](el);return}
  act(el.dataset.act,el);
});
$('#app').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches('[data-act][tabindex]'))act(e.target.dataset.act,e.target);
  if(e.key==='Enter'&&e.target.id==='prc'){const b=document.querySelector('.say .btn');if(b)acts.prComment(b)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(sheetFn)closeSheet();else if(pages.length){pages.pop();renderPages()}}});
$('#app').addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='msg'){S.msg=e.target.value;grow();syncCommit()}
  else if(id==='gq'){S.q=e.target.value;$('#glist').innerHTML=graphList()}
  else if(id==='fq'){S.fq=e.target.value;$('#flist').innerHTML=filesBody()}
  else if(id==='rq'){$('#rlist').innerHTML=refList(e.target.value)}
  else if(id==='sq'){$('#slist').innerHTML=switchList(e.target.value)}
});
/* swipe to stage / discard */
let sw=null;
const app=$('#app');
app.addEventListener('pointerdown',e=>{
  const fg=e.target.closest('.fg'),row=fg&&fg.parentElement;if(!row||!row.dataset.kind||e.target.closest('.circ'))return;
  sw={fg,row,x:e.clientX,y:e.clientY,dx:0,drag:false};
});
app.addEventListener('pointermove',e=>{
  if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
  if(!sw.drag){
    if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.4){sw.drag=true;sw.fg.style.transition='none';try{sw.fg.setPointerCapture(e.pointerId)}catch(_){}}
    else if(Math.abs(dy)>10){sw=null;return}
  }
  if(sw.drag){
    const ok=dx>0?!!sw.row.dataset.swipeR:!!sw.row.dataset.swipeL;
    sw.dx=ok?Math.max(-140,Math.min(140,dx)):dx/6;sw.fg.style.transform=`translateX(${sw.dx}px)`;sw.row.dataset.dir=ok?(dx>0?'r':'l'):'';
  }
});
function swEnd(){
  if(!sw)return;const{fg,row,dx,drag}=sw;sw=null;if(!drag)return;
  fg.style.transition='';fg.style.transform='';row.dataset.dir='';suppress=true;setTimeout(()=>suppress=false,60);
  const a=dx>80?row.dataset.swipeR:dx<-80?row.dataset.swipeL:null;if(a)act(a,row);
}
app.addEventListener('pointerup',swEnd);app.addEventListener('pointercancel',swEnd);

/* ============ boot ============ */
try{const t=localStorage.getItem('pg-theme');if(t&&t!=='auto'){S.theme=t;document.documentElement.setAttribute('data-theme',t)}}catch(e){}
render();
})();
</script>
